<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    svg line { transition: stroke 0.2s, stroke-width 0.2s; }
    .table-box { transition: filter 0.2s; }
    .table-box:hover { filter: brightness(1.08); cursor: pointer; }
    .table-box.active rect.header { stroke: #f59e0b; stroke-width: 2.5; }
    .table-box.dimmed { opacity: 0.22; }
    .rel-line { transition: opacity 0.2s; }
    .rel-line.dimmed { opacity: 0.06; }
    .rel-line.highlight { stroke: #f59e0b !important; stroke-width: 2.5 !important; opacity: 1 !important; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased">
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl shadow-sm overflow-hidden">
  <!-- Header -->
  <div class="px-5 py-3 border-b border-[var(--border)] flex items-center justify-between">
    <div>
      <h2 class="font-semibold text-[var(--foreground)] text-base">DietSense — Entity Relationship Diagram</h2>
      <p class="text-[var(--muted-foreground)] text-xs mt-0.5">11 tables · Click a table to highlight its relationships</p>
    </div>
    <div class="flex gap-3 text-xs text-[var(--muted-foreground)]">
      <span class="flex items-center gap-1"><span class="inline-block w-3 h-1 bg-amber-400 rounded"></span> FK link</span>
      <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-sm bg-emerald-500"></span> PK</span>
      <span class="flex items-center gap-1"><span class="inline-block w-2 h-2 rounded-sm bg-sky-400"></span> FK</span>
    </div>
  </div>

  <!-- SVG Canvas (scrollable) -->
  <div class="overflow-auto" style="max-height:680px;">
  <svg id="erSvg" width="1260" height="1020" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit;font-size:11px;">

    <!-- ── Relationship lines (drawn under tables) ── -->
    <g id="lines">
      <!-- users → dietary_restrictions -->
      <line class="rel-line" data-from="users" data-to="dietary_restrictions" x1="220" y1="140" x2="220" y2="280" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- users → preference_weights -->
      <line class="rel-line" data-from="users" data-to="preference_weights" x1="60" y1="160" x2="60" y2="700" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="preference_weights" x1="60" y1="700" x2="110" y2="700" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- users → meal_plans -->
      <line class="rel-line" data-from="users" data-to="meal_plans" x1="400" y1="140" x2="570" y2="140" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="meal_plans" x1="570" y1="140" x2="570" y2="20" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="meal_plans" x1="570" y1="20" x2="680" y2="20" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="meal_plans" x1="680" y1="20" x2="680" y2="50" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- users → progress_logs -->
      <line class="rel-line" data-from="users" data-to="progress_logs" x1="400" y1="100" x2="440" y2="100" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="progress_logs" x1="440" y1="100" x2="440" y2="680" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="progress_logs" x1="440" y1="680" x2="470" y2="680" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- users → ai_interaction_logs -->
      <line class="rel-line" data-from="users" data-to="ai_interaction_logs" x1="400" y1="120" x2="460" y2="120" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="ai_interaction_logs" x1="460" y1="120" x2="460" y2="850" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="ai_interaction_logs" x1="460" y1="850" x2="480" y2="850" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- users → user_feedback -->
      <line class="rel-line" data-from="users" data-to="user_feedback" x1="200" y1="160" x2="200" y2="590" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="users" data-to="user_feedback" x1="200" y1="590" x2="470" y2="590" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- meal_plans → meal_plan_items -->
      <line class="rel-line" data-from="meal_plans" data-to="meal_plan_items" x1="860" y1="120" x2="860" y2="310" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- recipes → meal_plan_items -->
      <line class="rel-line" data-from="recipes" data-to="meal_plan_items" x1="1040" y1="300" x2="1040" y2="360" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- meal_plan_items → user_feedback -->
      <line class="rel-line" data-from="meal_plan_items" data-to="user_feedback" x1="800" y1="420" x2="800" y2="590" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="meal_plan_items" data-to="user_feedback" x1="800" y1="590" x2="740" y2="590" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- recipes → recipe_ingredients -->
      <line class="rel-line" data-from="recipes" data-to="recipe_ingredients" x1="960" y1="280" x2="900" y2="280" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="recipes" data-to="recipe_ingredients" x1="900" y1="280" x2="900" y2="470" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <line class="rel-line" data-from="recipes" data-to="recipe_ingredients" x1="900" y1="470" x2="860" y2="470" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
      <!-- foods → recipe_ingredients -->
      <line class="rel-line" data-from="foods" data-to="recipe_ingredients" x1="680" y1="500" x2="720" y2="500" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,3"/>
    </g>

    <!-- ════════════════════════════════════════════════
         TABLE COMPONENTS
         Each table: group.table-box, rect.header (colored), text rows
    ═════════════════════════════════════════════════ -->

    <!-- ── users ─────────────────────────────────────────────── -->
    <g class="table-box" id="tbl-users" onclick="selectTable('users')">
      <rect x="40" y="50" width="360" height="120" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
      <rect class="header" x="40" y="50" width="360" height="30" rx="8" fill="#4f46e5" stroke="none"/>
      <rect x="40" y="68" width="360" height="12" fill="#4f46e5"/>
      <text x="220" y="71" text-anchor="middle" fill="white" font-weight="700" font-size="12">users</text>
      <!-- rows -->
      <text x="56" y="97" fill="#10b981" font-size="10">🔑 id</text><text x="220" y="97" fill="var(--muted-foreground)" font-size="10">UUID (PK, Supabase Auth UID)</text>
      <line x1="48" y1="101" x2="392" y2="101" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="114" fill="var(--foreground)" font-size="10">email</text><text x="220" y="114" fill="var(--muted-foreground)" font-size="10">TEXT UNIQUE NOT NULL</text>
      <line x1="48" y1="118" x2="392" y2="118" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="131" fill="var(--foreground)" font-size="10">age, gender, height_cm, weight_kg</text><text x="300" y="131" fill="var(--muted-foreground)" font-size="10">profile fields</text>
      <line x1="48" y1="135" x2="392" y2="135" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="148" fill="var(--foreground)" font-size="10">goal, activity_level</text><text x="220" y="148" fill="var(--muted-foreground)" font-size="10">ENUM types</text>
      <line x1="48" y1="152" x2="392" y2="152" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="165" fill="var(--foreground)" font-size="10">daily_calorie_target</text><text x="220" y="165" fill="var(--muted-foreground)" font-size="10">INTEGER (Harris-Benedict)</text>
    </g>

    <!-- ── dietary_restrictions ──────────────────────────────── -->

      <rect x="40" y="298" width="360" height="12" fill="#dc2626"/>

      <text x="56" y="326" fill="#10b981" font-size="10">🔑 id</text><text x="220" y="326" fill="var(--muted-foreground)" font-size="10">SERIAL PK</text>
      <line x1="48" y1="330" x2="392" y2="330" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="343" fill="#38bdf8" font-size="10">🔗 user_id</text><text x="220" y="343" fill="var(--muted-foreground)" font-size="10">UUID → users.id (CASCADE)</text>
      <line x1="48" y1="347" x2="392" y2="347" stroke="var(--border)" stroke-width="0.5"/>

      <line x1="48" y1="364" x2="392" y2="364" stroke="var(--border)" stroke-width="0.5"/>
      <text x="56" y="377" fill="var(--foreground)" font-size="10">allergen_flags</text><text x="220" y="377" fill="var(--muted-foreground)" font-size="10">TEXT[] — checked BEFORE scoring</text>
    </g>

    <!-- ── preference_weights ────────────────────────────────── -->
    <g class="table-box" id="tbl-preference_weights" onclick="selectTable('preference_weights')">

      <rect x="110" y="698" width="330" height="12" fill="#7c3aed"/>

      <text x="126" y="727" fill="#10b981" font-size="10">🔑 id</text><text x="270" y="727" fill="var(--muted-foreground)" font-size="10">SERIAL PK</text>
      <line x1="118" y1="731" x2="432" y2="731" stroke="var(--border)" stroke-width="0.5"/>
      <text x="126" y="744" fill="#38bdf8" font-size="10">🔗 user_id</text><text x="270" y="744" fill="var(--muted-foreground)" font-size="10">UUID → users.id UNIQUE</text>
      <line x1="118" y1="748" x2="432" y2="748" stroke="var(--border)" stroke-width="0.5"/>
      <text x="126" y="761" fill="var(--foreground)" font-size="10">cuisine_scores</text><text x="270" y="761" fill="var(--muted-foreground)" font-size="10">JSONB {"indian":0.8, …}</text>
      <line x1="118" y1="765" x2="432" y2="765" stroke="var(--border)" stroke-width="0.5"/>
      <text x="126" y="778" fill="var(--foreground)" font-size="10">ingredient_scores, disliked_ingredients</text><text x="350" y="778" fill="var(--muted-foreground)" font-size="10">JSONB / TEXT[]</text>
    </g>

    <!-- ── meal_plans ─────────────────────────────────────────── -->
    <g class="table-box" id="tbl-meal_plans" onclick="selectTable('meal_plans')">
      <rect x="640" y="50" width="340" height="115" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.2"/>
      <rect class="header" x="640" y="50" width="340" height="30" rx="8" fill="#0891b2" stroke="none"/>
      <rect x="640" y="68" width="340" height="12" fill="#0891b2"/>
      <text x="810" y="71" text-anchor="middle" fill="white" font-weight="700" font-size="12">meal_plans</text>
      <text x="656" y="97" fill="#10b981" font-size="10">🔑 id</text><text x="810" y="97" fill="var(--muted-foreground)" font-size="10">SERIAL PK</text>

    </g>

    <g class="table-box" id="tbl-meal_plan_items" onclick="selectTable('meal_plan_items')">

      <line x1="728" y1="361" x2="1052" y2="361" stroke="var(--border)" stroke-width="0.5"/>

<script>
  let active = null;

  const relations = {
    users: ['dietary_restrictions','preference_weights','meal_plans','progress_logs','ai_interaction_logs','user_feedback'],
    dietary_restrictions: ['users'],
    preference_weights: ['users'],
    meal_plans: ['users','meal_plan_items'],
    meal_plan_items: ['meal_plans','recipes','user_feedback'],
    user_feedback: ['meal_plan_items','users'],
    recipes: ['meal_plan_items','recipe_ingredients'],
    recipe_ingredients: ['recipes','foods'],
    foods: ['recipe_ingredients'],
    progress_logs: ['users'],
    ai_interaction_logs: ['users'],
  };

  function selectTable(id) {
    const allTables = document.querySelectorAll('.table-box');
    const allLines = document.querySelectorAll('.rel-line');

    if (active === id) {
      // deselect
      active = null;
      allTables.forEach(t => { t.classList.remove('active','dimmed'); });
      allLines.forEach(l => { l.classList.remove('highlight','dimmed'); });
      return;
    }
    active = id;

    const connected = new Set(relations[id] || []);
    connected.add(id);

    allTables.forEach(t => {
      const tid = t.id.replace('tbl-','');
      t.classList.remove('active','dimmed');
      if (tid === id) t.classList.add('active');
      else if (!connected.has(tid)) t.classList.add('dimmed');
    });

    allLines.forEach(l => {
      const from = l.dataset.from, to = l.dataset.to;
      l.classList.remove('highlight','dimmed');
      if ((from === id || to === id)) l.classList.add('highlight');
      else l.classList.add('dimmed');
    });
  }
</script>
