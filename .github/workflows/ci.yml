name: DietSense CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  repository-check:
    name: Repository Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -d frontend
          test -d backend
          test -d ml
          test -d data
          test -d tests
          test -d docs

          echo "Repository structure is valid."

  backend-check:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend Python files
        run: |
          python -m compileall -q backend

  ml-check:
    name: ML Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile ML Python files
        run: |
          python -m compileall -q ml

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyJWT "pydantic>=2.7" pydantic-settings
          python -m pip install -r backend/requirements.txt
          python -m pip install -r ml/requirements.txt
          python -m pip install pytest pypdf httpx

      - name: Download source datasets
        run: |
          python scripts/download_sources.py

      - name: Run ETL pipeline
        run: |
          python scripts/etl_usda.py
          python scripts/etl_ifct.py
          python scripts/merge_sources.py
          python scripts/load_db.py

      - name: Run tests
        env:
          # PYTHONPATH must include both the repo root (for ml/, routes/, scripts/)
          # and the backend/ directory (for app/ imports)
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          # Use a test-only JWT secret so auth tests can self-sign tokens offline
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_AUDIENCE: authenticated
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build
