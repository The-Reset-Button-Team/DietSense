<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .node { transition: transform 0.15s, filter 0.15s; cursor: default; }
    .node:hover { filter: brightness(1.1); }
    .arrow { marker-end: url(#arrow); }
    @keyframes flow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line { stroke-dasharray: 6 3; animation: flow 1.2s linear infinite; }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased">
<div class="bg-[var(--card)] border border-[var(--border)] rounded-xl shadow-sm overflow-hidden">
  <div class="px-5 py-3 border-b border-[var(--border)]">
    <h2 class="font-semibold text-[var(--foreground)] text-base">DietSense — Primary Architectural Pipeline</h2>
    <p class="text-[var(--muted-foreground)] text-xs mt-0.5">End-to-end flow from raw nutrition data → personalised meal plan → user feedback loop</p>
  </div>

  <div class="overflow-x-auto">
  <svg width="1100" height="580" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit;font-size:11px;">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
      </marker>
      <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
      </marker>
    </defs>

    <!-- ── STEP 1: Data Sources ── -->
    <g class="node">
      <rect x="20" y="60" width="140" height="64" rx="10" fill="#78350f" stroke="#a16207" stroke-width="1.5"/>
      <text x="90" y="84" text-anchor="middle" fill="white" font-weight="700" font-size="11">📦 Data Sources</text>
      <text x="90" y="99" text-anchor="middle" fill="#fcd34d" font-size="10">USDA FoodData Central</text>
      <text x="90" y="113" text-anchor="middle" fill="#fcd34d" font-size="10">ICMR-NIN / IFCT 2017</text>
    </g>

    <!-- arrow 1→2 -->
    <line class="arrow flow-line" x1="160" y1="92" x2="198" y2="92" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 2: ETL ── -->
    <g class="node">
      <rect x="200" y="60" width="130" height="64" rx="10" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
      <text x="265" y="84" text-anchor="middle" fill="white" font-weight="700" font-size="11">⚙️ ETL Pipeline</text>
      <text x="265" y="99" text-anchor="middle" fill="#a8a29e" font-size="10">Pandas / NumPy</text>
      <text x="265" y="113" text-anchor="middle" fill="#a8a29e" font-size="10">Normalize → per 100g</text>
    </g>

    <!-- phase badge -->
    <rect x="215" y="45" width="98" height="14" rx="4" fill="#92400e"/>
    <text x="264" y="56" text-anchor="middle" fill="#fcd34d" font-size="9" font-weight="600">Phase 2 — ETL</text>

    <!-- arrow 2→3 -->
    <line class="arrow flow-line" x1="330" y1="92" x2="368" y2="92" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 3: PostgreSQL ── -->
    <g class="node">
      <rect x="370" y="52" width="130" height="80" rx="10" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5"/>
      <text x="435" y="76" text-anchor="middle" fill="white" font-weight="700" font-size="11">🗄️ PostgreSQL</text>
      <text x="435" y="91" text-anchor="middle" fill="#93c5fd" font-size="10">Supabase (Free Tier)</text>
      <text x="435" y="106" text-anchor="middle" fill="#93c5fd" font-size="10">foods / recipes / users</text>
      <text x="435" y="121" text-anchor="middle" fill="#93c5fd" font-size="10">meal_plans / feedback</text>
    </g>

    <rect x="385" y="38" width="98" height="14" rx="4" fill="#1e3a5f" stroke="#2563eb"/>
    <text x="434" y="49" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">Phase 3 — DB Setup</text>

    <!-- arrow 3→4 -->
    <line class="arrow flow-line" x1="500" y1="92" x2="538" y2="92" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 4: FastAPI Backend ── -->
    <g class="node">
      <rect x="540" y="52" width="130" height="80" rx="10" fill="#1a2e1a" stroke="#16a34a" stroke-width="1.5"/>
      <text x="605" y="76" text-anchor="middle" fill="white" font-weight="700" font-size="11">🚀 FastAPI</text>
      <text x="605" y="91" text-anchor="middle" fill="#86efac" font-size="10">REST API + Auth</text>
      <text x="605" y="106" text-anchor="middle" fill="#86efac" font-size="10">Pydantic validation</text>
      <text x="605" y="121" text-anchor="middle" fill="#86efac" font-size="10">JWT / Supabase Auth</text>
    </g>

    <rect x="555" y="38" width="98" height="14" rx="4" fill="#1a2e1a" stroke="#16a34a"/>
    <text x="604" y="49" text-anchor="middle" fill="#86efac" font-size="9" font-weight="600">Phase 4 — API</text>

    <!-- ── RULE 2: Safety Gate ── -->
    <rect x="540" y="170" width="130" height="54" rx="8" fill="#7f1d1d" stroke="#dc2626" stroke-width="2"/>
    <text x="605" y="191" text-anchor="middle" fill="white" font-weight="700" font-size="11">🛡️ Safety Gate</text>
    <text x="605" y="206" text-anchor="middle" fill="#fca5a5" font-size="10">Rule 2: Allergens &amp;</text>
    <text x="605" y="220" text-anchor="middle" fill="#fca5a5" font-size="10">restrictions → FIRST</text>

    <!-- arrow FastAPI → Safety Gate -->
    <line class="arrow" x1="605" y1="132" x2="605" y2="168" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- arrow Safety Gate → ML Scoring -->
    <line class="arrow" x1="605" y1="224" x2="605" y2="258" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- ── STEP 5: ML Scoring ── -->
    <g class="node">
      <rect x="540" y="260" width="130" height="100" rx="10" fill="#2d1b6e" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="605" y="282" text-anchor="middle" fill="white" font-weight="700" font-size="11">🤖 Hybrid Scoring</text>
      <text x="605" y="297" text-anchor="middle" fill="#c4b5fd" font-size="9">0.30 × Macro match</text>
      <text x="605" y="310" text-anchor="middle" fill="#c4b5fd" font-size="9">0.20 × Goal align</text>
      <text x="605" y="323" text-anchor="middle" fill="#c4b5fd" font-size="9">0.20 × Preference</text>
      <text x="605" y="336" text-anchor="middle" fill="#c4b5fd" font-size="9">0.15 × Feedback</text>
      <text x="605" y="349" text-anchor="middle" fill="#c4b5fd" font-size="9">0.10 × Diversity · 0.05 × Prep</text>
    </g>

    <rect x="555" y="246" width="98" height="14" rx="4" fill="#2d1b6e" stroke="#7c3aed"/>
    <text x="604" y="257" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="600">Phase 6 — Rec Engine</text>

    <!-- arrow ML → XAI -->
    <line class="arrow flow-line" x1="605" y1="360" x2="605" y2="398" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 6: XAI / SHAP ── -->
    <g class="node">
      <rect x="540" y="400" width="130" height="64" rx="10" fill="#1c1c3a" stroke="#6366f1" stroke-width="1.5"/>
      <text x="605" y="423" text-anchor="middle" fill="white" font-weight="700" font-size="11">🔍 XAI / SHAP</text>
      <text x="605" y="438" text-anchor="middle" fill="#a5b4fc" font-size="10">Feature attribution</text>
      <text x="605" y="453" text-anchor="middle" fill="#a5b4fc" font-size="10">→ prose explanation</text>
    </g>

    <rect x="555" y="386" width="98" height="14" rx="4" fill="#1c1c3a" stroke="#6366f1"/>
    <text x="604" y="397" text-anchor="middle" fill="#a5b4fc" font-size="9" font-weight="600">Phase 8 — XAI</text>

    <!-- arrow XAI → Gemini -->
    <line class="arrow flow-line" x1="670" y1="432" x2="718" y2="432" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 7: Gemini ── -->
    <g class="node">
      <rect x="720" y="400" width="140" height="80" rx="10" fill="#3b0764" stroke="#a21caf" stroke-width="1.5"/>
      <text x="790" y="425" text-anchor="middle" fill="white" font-weight="700" font-size="11">✨ Gemini API</text>
      <text x="790" y="440" text-anchor="middle" fill="#e879f9" font-size="10">NL Explanations ONLY</text>
      <text x="790" y="455" text-anchor="middle" fill="#e879f9" font-size="10">Rule 1: Never writes</text>
      <text x="790" y="470" text-anchor="middle" fill="#e879f9" font-size="10">nutrition facts</text>
    </g>

    <rect x="735" y="386" width="108" height="14" rx="4" fill="#3b0764" stroke="#a21caf"/>
    <text x="789" y="397" text-anchor="middle" fill="#e879f9" font-size="9" font-weight="600">Phase 8 — Gemini</text>

    <!-- arrow Gemini → Next.js -->
    <line class="arrow flow-line" x1="860" y1="440" x2="918" y2="440" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- ── STEP 8: Next.js Frontend ── -->
    <g class="node">
      <rect x="920" y="400" width="150" height="80" rx="10" fill="#0c1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="995" y="424" text-anchor="middle" fill="white" font-weight="700" font-size="11">🖥️ Next.js UI</text>
      <text x="995" y="439" text-anchor="middle" fill="#7dd3fc" font-size="10">Dashboard + Charts</text>
      <text x="995" y="454" text-anchor="middle" fill="#7dd3fc" font-size="10">Tailwind CSS + Recharts</text>
      <text x="995" y="469" text-anchor="middle" fill="#7dd3fc" font-size="10">Vercel deployment</text>
    </g>

    <rect x="935" y="386" width="118" height="14" rx="4" fill="#0c1a2e" stroke="#0ea5e9"/>
    <text x="994" y="397" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="600">Phase 5 — Frontend UI</text>

    <!-- ── Feedback Loop arrow ── -->
    <!-- user → feedback box -->
    <rect x="920" y="510" width="150" height="36" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1.5"/>
    <text x="995" y="528" text-anchor="middle" fill="white" font-weight="700" font-size="11">⭐ User Feedback</text>
    <text x="995" y="542" text-anchor="middle" fill="#fed7aa" font-size="9">Rating 1–5 → adaptive</text>

    <line x1="995" y1="480" x2="995" y2="508" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

    <!-- feedback → ML scoring (curved feedback loop) -->
    <path d="M920,528 Q800,560 740,400 Q720,340 670,310" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-gold)"/>
    <text x="800" y="555" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">↺ Adaptive Re-Ranking (Phase 7)</text>

    <!-- WHO Guidelines reference bubble -->
    <rect x="20" y="220" width="160" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="240" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">📋 WHO Guidelines</text>
    <text x="100" y="254" text-anchor="middle" fill="#64748b" font-size="9">Carbs 45–75% energy</text>
    <text x="100" y="266" text-anchor="middle" fill="#64748b" font-size="9">Fat &lt;30%, Sugar &lt;10%</text>
    <text x="100" y="278" text-anchor="middle" fill="#64748b" font-size="9">Salt &lt;5g/day, Fibre ≥25g</text>
    <line x1="180" y1="255" x2="538" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="340" y="272" fill="#475569" font-size="9">anchors macro_match_score</text>

    <!-- Scikit-learn badge -->
    <rect x="720" y="260" width="140" height="80" rx="10" fill="#1a2e1a" stroke="#16a34a" stroke-width="1.5"/>
    <text x="790" y="284" text-anchor="middle" fill="white" font-weight="700" font-size="11">📈 Scikit-learn</text>
    <text x="790" y="299" text-anchor="middle" fill="#86efac" font-size="10">Ridge Regression</text>
    <text x="790" y="314" text-anchor="middle" fill="#86efac" font-size="10">Preference weights</text>
    <text x="790" y="329" text-anchor="middle" fill="#86efac" font-size="10">KMeans clustering</text>
    <text x="790" y="344" text-anchor="middle" fill="#86efac" font-size="10">Precision@K / NDCG</text>
    <line x1="720" y1="300" x2="672" y2="300" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  </svg>
  </div>

  <div class="px-5 py-2 border-t border-[var(--border)] flex flex-wrap gap-4 text-xs text-[var(--muted-foreground)]">
    <span>🛡️ Safety Gate runs <strong>before</strong> any ML scoring</span>
    <span>Rule 1: Gemini never generates/alters nutrition facts</span>
    <span>↺ Yellow arrows = adaptive feedback loop</span>
  </div>
</div>
</body>
</html>
